name: TEFAS karsilastirma testi
on:
  push:
    branches: [tefas-test-2]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Hiz testi
        run: |
          python3 -u - <<'PY'
          import json, time, urllib.request, urllib.error
          U = "https://www.tefas.gov.tr/api/funds/fonFiyatBilgiGetir"
          H = {"User-Agent": "Mozilla/5.0", "Content-Type": "application/json", "Accept": "application/json, text/plain, */*"}
          kodlar = [l.strip() for l in open("fund_list.dat") if l.strip()]
          bas = time.time()
          for tur in (1, 2):
              for k in kodlar:
                  t = time.time()
                  req = urllib.request.Request(U, data=json.dumps({"fonKodu": k, "dil": "TR", "periyod": 1}).encode(), headers=H, method="POST")
                  try:
                      with urllib.request.urlopen(req, timeout=10) as r:
                          n = len(json.loads(r.read()).get("resultList") or [])
                      print(f"HIZ t={t-bas:6.1f} tur={tur} {k} ok satir={n} sure={time.time()-t:.2f}")
                  except urllib.error.HTTPError as e:
                      print(f"HIZ t={t-bas:6.1f} tur={tur} {k} HTTP {e.code} {e.read()[:120]}")
                  except Exception as e:
                      print(f"HIZ t={t-bas:6.1f} tur={tur} {k} HATA {repr(e)[:120]} sure={time.time()-t:.2f}")
                  time.sleep(1)
          PY
